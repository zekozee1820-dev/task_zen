<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>TaskZen</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">

</head>
<body>

  <div class="app">

    <select id="langSelect" onchange="changeLang()">
      <option value="ar">🇪🇬 عربي</option>
      <option value="en">🇬🇧 English</option>
    </select>

    <h1 id="title">📋 TaskZen</h1>

    <div class="add-task">
      <input type="text" id="taskInput">
      <button id="addBtn" onclick="addTask()">إضافة</button>
    </div>

    <div class="controls">
      <button onclick="clearAll()">🗑 حذف كل المهام</button>
      <button onclick="exportPDF()">📄 تصدير PDF</button>
      <button onclick="shareApp()">📤 شارك التطبيق</button>
    </div>

    <ul id="taskList"></ul>

    <p class="footer">من إبداع زياد المغربي</p>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
